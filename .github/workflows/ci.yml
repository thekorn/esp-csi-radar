name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Evaluate flake
        run: nix flake check --no-build

      - name: Check firmware formatting
        run: nix develop .#setup --command zig fmt --check build.zig main/main.zig

      - name: Run Zig tests
        run: nix develop .#setup --command zig build test

      - name: Install host dependencies
        run: nix develop .#setup --command pnpm install --frozen-lockfile

      - name: Required pre-commit type check
        run: nix develop .#setup --command pnpm run typecheck

      - name: Required pre-commit lint check
        run: nix develop .#setup --command pnpm run lint

      - name: Required pre-commit format check
        run: nix develop .#setup --command pnpm run format:check

      - name: Run host tests
        run: nix develop .#setup --command pnpm test

      - name: Spell check
        run: nix develop .#setup --command codebook-lsp lint --unique -s .

      - name: Build firmware
        env:
          ESP_NETWORK_NAME: ci-radar
          ESP_NETWORK_SECRET: ci-secret
          ESP_SERVER_HOST: radar.invalid
          ESP_SERVER_PORT: "8080"
        run: nix develop .#setup --command idf.py build
